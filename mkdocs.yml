site_name: GCMystSolver Handbuch
site_url: https://gcmystsolver.de/
site_description: Anleitung und Referenz für GCMystSolver – die Android-App zum Lösen von Geocaching-Mystery-Caches.
repo_url: https://gcmystsolver.de/downloads/GCMystSolver.apk
repo_name: APK herunterladen
edit_uri: ""

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/lang-redirect.js

theme:
  name: material
  logo: assets/app-icon.png
  favicon: assets/favicon.png
  icon:
    repo: material/download
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Start: Home
            Erste Schritte: Getting Started
            Funktionen: Features
            "Import & Export (GPX / PocketQuery)": "Import & Export (GPX / PocketQuery)"
            Automatische Solver: Automatic Solvers
            KI-Lösungsversuch: AI Solving
            AI-Chat pro Cache: AI Chat per Cache
            Challenge-Prüfung: Challenge Checking
            "Datenbank, Listen & Statistik": "Database, Lists & Statistics"
            Einstellungen & Backup: Settings & Backup
            FAQ: FAQ
            "Support (Bugs & Ideen)": "Support (Bugs & Ideas)"
            Datenschutz: Privacy Policy
