site_name: GCMystSolver Handbuch
site_url: https://gcmystsolver.de/
site_description: Anleitung und Referenz für GCMystSolver – die Android-App zum Lösen von Geocaching-Mystery-Caches.
repo_url: https://github.com/gcprogram/Geocaching-Mystery-Solver
repo_name: GCMystSolver (App)
edit_uri: ""

theme:
  name: material
  logo: assets/app-icon.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Start: Home
            Erste Schritte: Getting Started
            Funktionen: Features
            "Import (GPX / PocketQuery)": "Import (GPX / PocketQuery)"
            Automatische Solver: Automatic Solvers
            KI-Lösungsversuch: AI Solving
            AI-Chat pro Cache: AI Chat per Cache
            Challenge-Prüfung: Challenge Checking
            "Datenbank, Listen & Statistik": "Database, Lists & Statistics"
            Einstellungen & Backup: Settings & Backup
            FAQ: FAQ
            "Support (Bugs & Ideen)": "Support (Bugs & Ideas)"
            Datenschutz: Privacy Policy
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Start: Accueil
            Erste Schritte: Premiers pas
            Funktionen: Fonctionnalités
            "Import (GPX / PocketQuery)": "Import (GPX / PocketQuery)"
            Automatische Solver: Solveurs automatiques
            KI-Lösungsversuch: Résolution par IA
            AI-Chat pro Cache: Chat IA par cache
            Challenge-Prüfung: Vérification des challenges
            "Datenbank, Listen & Statistik": "Base de données, listes et statistiques"
            Einstellungen & Backup: Paramètres et sauvegarde
            FAQ: FAQ
            "Support (Bugs & Ideen)": "Support (bugs et idées)"
            Datenschutz: Confidentialité
        - locale: nl
          name: Nederlands
          build: true
          nav_translations:
            Start: Start
            Erste Schritte: Eerste stappen
            Funktionen: Functies
            "Import (GPX / PocketQuery)": "Import (GPX / PocketQuery)"
            Automatische Solver: Automatische oplossers
            KI-Lösungsversuch: AI-oplospoging
            AI-Chat pro Cache: AI-chat per cache
            Challenge-Prüfung: Challenge-controle
            "Datenbank, Listen & Statistik": "Database, lijsten & statistiek"
            Einstellungen & Backup: Instellingen & back-up
            FAQ: Veelgestelde vragen
            "Support (Bugs & Ideen)": "Ondersteuning (bugs & ideeën)"
            Datenschutz: Privacybeleid
        - locale: cs
          name: Čeština
          build: true
          nav_translations:
            Start: Domů
            Erste Schritte: První kroky
            Funktionen: Funkce
            "Import (GPX / PocketQuery)": "Import (GPX / PocketQuery)"
            Automatische Solver: Automatické řešiče
            KI-Lösungsversuch: Řešení pomocí AI
            AI-Chat pro Cache: AI chat ke keši
            Challenge-Prüfung: Kontrola výzev
            "Datenbank, Listen & Statistik": "Databáze, seznamy a statistiky"
            Einstellungen & Backup: Nastavení a záloha
            FAQ: Časté dotazy
            "Support (Bugs & Ideen)": "Podpora (chyby a nápady)"
            Datenschutz: Ochrana soukromí

nav:
  - Start: index.md
  - Erste Schritte: erste-schritte.md
  - Funktionen:
      - funktionen/index.md
      - Import (GPX / PocketQuery): funktionen/import.md
      - Automatische Solver: funktionen/solver.md
      - KI-Lösungsversuch: funktionen/ki-solver.md
      - AI-Chat pro Cache: funktionen/ai-chat.md
      - Challenge-Prüfung: funktionen/challenges.md
      - Datenbank, Listen & Statistik: funktionen/datenbank-statistik.md
      - Einstellungen & Backup: funktionen/einstellungen-backup.md
  - FAQ: faq.md
  - Support (Bugs & Ideen): support.md
  - Datenschutz: datenschutz.md
